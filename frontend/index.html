<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CekFakta - Verifikasi & Deteksi Hoaks Berita</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Newsreader for editorial flair -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
            },
            colors: {
              editorial: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                800: '#1e293b',
                900: '#0f172a',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Clean Editorial Sentence Highlighting */
      .sentence-item {
        display: inline;
        padding: 2px 4px;
        margin: 0 1px;
        border-radius: 4px;
        transition: background-color 0.15s ease, box-shadow 0.15s ease;
        cursor: pointer;
        line-height: 2.1;
      }
      .sentence-item.tier-high {
        background-color: #fee2e2;
        color: #991b1b;
        border-bottom: 2px solid #f87171;
      }
      .sentence-item.tier-high:hover {
        background-color: #fecaca;
      }
      .sentence-item.tier-high.active {
        background-color: #fecaca;
        outline: 2px solid #dc2626;
        outline-offset: 1px;
      }

      .sentence-item.tier-medium {
        background-color: #fef3c7;
        color: #92400e;
        border-bottom: 2px solid #fbbf24;
      }
      .sentence-item.tier-medium:hover {
        background-color: #fde68a;
      }
      .sentence-item.tier-medium.active {
        background-color: #fde68a;
        outline: 2px solid #d97706;
        outline-offset: 1px;
      }

      .sentence-item.tier-low {
        background-color: transparent;
        color: #1e293b;
      }
      .sentence-item.tier-low:hover {
        background-color: #f1f5f9;
      }
      .sentence-item.tier-low.active {
        background-color: #e2e8f0;
        outline: 2px solid #64748b;
        outline-offset: 1px;
      }

      /* Editorial Markdown Container */
      .editorial-prose h1, .editorial-prose h2, .editorial-prose h3 {
        font-weight: 700;
        color: #0f172a;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }
      .editorial-prose h3:first-child {
        margin-top: 0;
      }
      .editorial-prose p {
        margin-bottom: 0.75rem;
        line-height: 1.65;
        color: #334155;
      }
      .editorial-prose ul {
        list-style-type: disc;
        padding-left: 1.25rem;
        margin-bottom: 0.75rem;
      }
      .editorial-prose li {
        margin-bottom: 0.35rem;
        line-height: 1.6;
        color: #334155;
      }
      .editorial-prose strong {
        color: #0f172a;
        font-weight: 600;
      }

      @media print {
        header, footer, .no-print, button { display: none !important; }
        body { background: white !important; color: black !important; }
        .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
      }
    </style>
  </head>
  <body class="bg-slate-50/70 text-slate-800 antialiased min-h-screen flex flex-col font-sans selection:bg-slate-200">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
